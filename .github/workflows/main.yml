name: 盤中大戶即時監控

on:
  schedule:
    # UTC 00:30 = 台灣 08:30。提早啟動，程式會自己等到開盤，用來吸收 GitHub 排程的延遲。
    - cron: '30 0 * * 1-5'
    # 備援：萬一上面那次被 GitHub 漏掉。有 concurrency 保護，不會重複執行。
    - cron: '50 0 * * 1-5'
  workflow_dispatch:

# 同一時間只允許一個監控在跑；備援那次會排隊，前一個結束(收盤)後它會發現已收盤就直接結束
concurrency:
  group: intraday-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 08:30 ~ 13:35 約 5 小時，留一點餘裕

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: 安裝所需套件
        run: pip install -r requirements.txt

      - name: 執行盤中循環掃描
        env:
          PYTHONUNBUFFERED: '1'
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_loop.py
